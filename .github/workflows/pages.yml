name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch real road geometry from OSRM
        # Best-effort: if the public router is rate-limiting or down, the
        # script swallows the error and any already-committed geometry
        # (or hand-crafted waypoints) ship instead. Build never fails
        # because of OSRM.
        run: npm run fetch-routes
        continue-on-error: true

      - name: Persist fetched geometry
        # Commit upgraded geometry back to the branch so it's permanent:
        # once a road is routed it never regresses to the coarse
        # approximation, even if a later OSRM fetch fails. Pushing with
        # GITHUB_TOKEN does not retrigger workflows, and this same run
        # already builds + deploys from the upgraded working tree, so the
        # site is correct immediately.
        run: |
          if git diff --quiet -- src/lib/roads/data.ts; then
            echo "No geometry changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/roads/data.ts
            git commit -m "chore: persist OSRM road geometry [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optional — set in GitHub repo Secrets to enable Google
          # sign-in. When unset, the build still succeeds and the auth UI
          # shows "sign-in is not configured".
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          # Reserved for future server-side data sync. Not used by the
          # current sign-in flow.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
